<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Scorecard</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #6b7385;
    --accent: #4f46e5; --green: #16a34a; --amber: #d97706; --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { background: var(--accent); color: #fff; padding: 24px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 1.8rem; }
  header p { margin: 6px 0 0; opacity: .9; }
  main { max-width: 820px; margin: 24px auto; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 20px;
  }
  h2 { margin-top: 0; font-size: 1.2rem; }
  label { font-weight: 600; display: block; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 10px; border: 1px solid #d5d9e3; border-radius: 8px; font-size: 1rem;
  }
  .row { display: grid; grid-template-columns: 1fr 70px; gap: 12px; align-items: center; margin: 14px 0; }
  .row small { color: var(--muted); font-weight: 400; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .val { text-align: center; font-weight: 700; font-size: 1.1rem; }
  .result { text-align: center; }
  .score { font-size: 3rem; font-weight: 800; margin: 4px 0; }
  .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; color: #fff; font-weight: 700; }
  button {
    background: var(--accent); color: #fff; border: 0; padding: 10px 18px;
    border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 6px 4px 0 0;
  }
  button.secondary { background: #e5e7f0; color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eceef4; }
  td.del { cursor: pointer; color: var(--red); text-align: right; }
  .empty { color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: .9rem; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>🧑‍💼 Candidate Scorecard</h1>
  <p>Rate candidates fairly and compare them side by side</p>
</header>

<main>
  <section class="card">
    <h2>1. Candidate</h2>
    <label for="name">Candidate name</label>
    <input type="text" id="name" placeholder="e.g. Anna Virtanen">
  </section>

  <section class="card">
    <h2>2. Rate skills (1 = weak, 5 = excellent)</h2>
    <div id="criteria"></div>
  </section>

  <section class="card result">
    <h2>3. Result</h2>
    <div class="score" id="score">0%</div>
    <span class="badge" id="badge">—</span>
    <div>
      <button id="save">💾 Save candidate</button>
      <button class="secondary" id="reset">↺ Reset</button>
    </div>
  </section>

  <section class="card">
    <h2>4. Compare candidates</h2>
    <div id="list"></div>
  </section>
</main>

<footer>Made by Chathuranga Fernando · HR + IT project</footer>

<script>
  // Criteria and their weights (weights add up to 100)
  const criteria = [
    { id: "comm",    name: "Communication",      weight: 25 },
    { id: "tech",    name: "Technical skills",   weight: 25 },
    { id: "exp",     name: "Experience",         weight: 20 },
    { id: "problem", name: "Problem solving",    weight: 15 },
    { id: "culture", name: "Team / culture fit", weight: 15 }
  ];

  const box = document.getElementById("criteria");
  criteria.forEach(c => {
    box.innerHTML += `
      <div class="row">
        <div>
          <label for="${c.id}">${c.name} <small>(weight ${c.weight}%)</small></label>
          <input type="range" id="${c.id}" min="1" max="5" value="3">
        </div>
        <div class="val" id="${c.id}-val">3</div>
      </div>`;
  });

  function calcScore() {
    let total = 0;
    criteria.forEach(c => {
      const v = Number(document.getElementById(c.id).value);
      document.getElementById(c.id + "-val").textContent = v;
      total += (v / 5) * c.weight;
    });
    return Math.round(total);
  }

  function verdict(score) {
    if (score >= 80) return { text: "Strong hire", color: "var(--green)" };
    if (score >= 60) return { text: "Consider",    color: "var(--amber)" };
    return               { text: "Not a fit",   color: "var(--red)" };
  }

  function update() {
    const s = calcScore();
    const v = verdict(s);
    document.getElementById("score").textContent = s + "%";
    const b = document.getElementById("badge");
    b.textContent = v.text;
    b.style.background = v.color;
  }

  // Saved candidates (kept in this browser only)
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem("scorecard") || "[]"); } catch (e) {}

  function store() {
    try { localStorage.setItem("scorecard", JSON.stringify(saved)); } catch (e) {}
  }

  function showList() {
    const list = document.getElementById("list");
    if (saved.length === 0) {
      list.innerHTML = '<p class="empty">No candidates saved yet.</p>';
      return;
    }
    const sorted = [...saved].sort((a, b) => b.score - a.score);
    list.innerHTML = `<table>
      <tr><th>#</th><th>Name</th><th>Score</th><th>Verdict</th><th></th></tr>
      ${sorted.map((c, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${c.name}</td>
          <td>${c.score}%</td>
          <td>${verdict(c.score).text}</td>
          <td class="del" data-id="${c.id}" title="Delete">✖</td>
        </tr>`).join("")}
    </table>`;
  }

  document.getElementById("list").addEventListener("click", e => {
    if (e.target.classList.contains("del")) {
      saved = saved.filter(c => c.id !== Number(e.target.dataset.id));
      store(); showList();
    }
  });

  document.getElementById("save").addEventListener("click", () => {
    const nameInput = document.getElementById("name");
    const name = nameInput.value.trim().replace(/[<>]/g, "");
    if (!name) { alert("Please enter a candidate name."); return; }
    saved.push({ id: Date.now(), name, score: calcScore() });
    store(); showList();
    document.getElementById("reset").click();
  });

  document.getElementById("reset").addEventListener("click", () => {
    document.getElementById("name").value = "";
    criteria.forEach(c => document.getElementById(c.id).value = 3);
    update();
  });

  criteria.forEach(c => document.getElementById(c.id).addEventListener("input", update));
  update();
  showList();
</script>
</body>
</html>
